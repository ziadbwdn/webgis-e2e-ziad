<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MapID Web GIS Dashboard" />
    <title>MapID Web GIS</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f9fafb;
        }

        #auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .auth-card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        .auth-card h1 {
            text-align: center;
            margin-bottom: 1.5rem;
            color: #111827;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #374151;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #e5e7eb;
            border-radius: 6px;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        .auth-link {
            text-align: center;
            margin-top: 1rem;
            color: #6b7280;
        }

        .auth-link a {
            color: #2563eb;
            text-decoration: none;
            cursor: pointer;
        }

        .auth-link a:hover {
            text-decoration: underline;
        }

        #dashboard-container {
            display: none;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #header {
            background: white;
            padding: 1rem 2rem;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #header h1 {
            color: #111827;
        }

        #logout-btn {
            padding: 0.5rem 1rem;
            background-color: #ef4444;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #logout-btn:hover {
            background-color: #dc2626;
        }

        .dashboard-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        #sidebar {
            width: 300px;
            background: white;
            border-right: 1px solid #e5e7eb;
            padding: 2rem;
            overflow-y: auto;
        }

        #sidebar h2 {
            color: #111827;
            margin-bottom: 1rem;
            font-size: 1.125rem;
        }

        .layer-item {
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            background: #f9fafb;
            border-radius: 6px;
            display: flex;
            align-items: center;
        }

        .layer-item input {
            width: auto;
            margin-right: 0.5rem;
        }

        .layer-item label {
            margin: 0;
            cursor: pointer;
            flex: 1;
        }

        #map {
            flex: 1;
            background-color: #f0f0f0;
        }

        .error {
            color: #ef4444;
            margin-top: 0.5rem;
            font-size: 0.875rem;
        }

        .success {
            color: #10b981;
            margin-top: 0.5rem;
            font-size: 0.875rem;
        }

        .loading {
            display: none;
            text-align: center;
            color: #6b7280;
            padding: 1rem;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- Auth Section -->
    <div id="auth-container" class="hidden">
        <div class="auth-card">
            <h1 id="auth-title">Login</h1>
            <form id="auth-form">
                <div id="name-group" class="form-group hidden">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required />
                    <div class="error" id="name-error"></div>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required />
                    <div class="error" id="email-error"></div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required />
                    <div class="error" id="password-error"></div>
                </div>

                <button type="submit" id="auth-submit">Login</button>
                <div class="error" id="form-error"></div>

                <div class="auth-link">
                    <span id="toggle-text">Don't have an account? <a id="toggle-auth">Sign up</a></span>
                </div>
            </form>
        </div>
    </div>

    <!-- Dashboard Section -->
    <div id="dashboard-container">
        <div id="header">
            <h1>MapID Web GIS Dashboard</h1>
            <div>
                <span id="user-name"></span>
                <button id="logout-btn">Logout</button>
            </div>
        </div>

        <div class="dashboard-content">
            <div id="sidebar">
                <h2>Layers</h2>
                <div id="layers-list"></div>
                <button id="upload-btn" style="width: 100%; margin-top: 1rem; padding: 0.75rem; background-color: #10b981; color: white; border: none; border-radius: 6px; cursor: pointer;">Upload Layer</button>
                <input type="file" id="file-input" style="display: none;" accept=".geojson,.json" />
            </div>
            <div id="map"></div>
        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
